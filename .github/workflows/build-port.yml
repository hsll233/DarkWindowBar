name: Build 26.2 Fabric port
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build with verified dependencies
        shell: pwsh
        run: ./build-local.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: darkwindowbar-fabric-26.2
          path: build-local/darkwindowbar-fabric-26.2-1.0.0-port.1.jar
          if-no-files-found: error
